# Build the static site, run the guards, and publish to GitHub Pages.
#
# THE SITE LIVES AT charlietrenorden.com/chronoscape/ and nowhere else. A project repo
# owned by charlie-tren is served under the user site's custom domain automatically,
# which is how consensus-drift and lindy-effect already work. No credentials needed.
#
# HISTORY, because the old shape of this file is confusing without it: the site used to
# be served at chronoscape.charlietrenorden.com by a DIRECT-UPLOAD Cloudflare Pages
# project (`chronoscape-timeline`) that did not rebuild on push, so the live site lagged
# the repo for months. The intended fix was a CLOUDFLARE_API_TOKEN secret that was never
# set, so every run reported success while the domain served a stale build. Pages
# publishing was added 20/08/2026, which briefly left the site live at BOTH URLs, each
# declaring itself canonical.
#
# RESOLVED 20/08/2026: `chronoscape-timeline` now serves nothing but a `_redirects` file
# that 301s every path to charlietrenorden.com/chronoscape/:splat. The old URL keeps
# working, there is one canonical copy, and no token is needed by anything.
#
# DO NOT re-add a `wrangler pages deploy site/dist --project-name chronoscape-timeline`
# step, and do not run that command by hand. It would overwrite the redirect with a
# second copy of the site and recreate the duplicate-canonical problem. If the subdomain
# ever needs rebuilding as a redirect, deploy a directory containing only `_redirects`.

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # version() reads git history and has already shipped a production bug on
          # Cloudflare's shallow clone - give it the full history here.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          # This repo's file is requirements-build.txt; the default cache glob only looks
          # for requirements.txt / pyproject.toml and hard-fails the step if it finds none.
          cache-dependency-path: requirements-build.txt

      - run: pip install -r requirements-build.txt pytest

      # Guards the code. validate.py (below) guards the data; these guard the maths
      # that positions dots and the version() shallow-clone branch, both of which
      # have shipped bugs before. A failure here stops the deploy.
      - name: Tests
        run: python -m pytest tests -q

      # validate.py runs inside build.py, so a malformed country fails here rather than
      # shipping.
      # SITE_URL is the canonical origin baked into <link rel=canonical>, og:url and the
      # sitemap. This is the only place the site is served from.
      - run: python site/build.py
        env:
          SITE_URL: https://charlietrenorden.com/chronoscape

      # upload-pages-artifact v4 stopped including hidden files in the artifact.
      # Checked before bumping: site/dist has no dotfiles and no `_`-prefixed paths,
      # so nothing is dropped. If a `.nojekyll` is ever added, revisit this.
      - name: Publish to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - id: pages
        uses: actions/deploy-pages@v5

      # A green deploy is not proof the page changed - that mistake has been made on this
      # repo three times. Check the live URL for the version string this run built, and
      # fail if it is not there. Keyed on a value that CHANGES every build, never on the
      # presence of a file that may already have existed.
      - name: Confirm the live site is serving this build
        run: |
          BUILT=$(grep -oE 'v3\.[0-9]+' site/dist/index.html | head -1)
          if [ -z "$BUILT" ]; then echo "could not read the built version"; exit 1; fi
          echo "built: $BUILT"
          for i in $(seq 1 12); do
            LIVE=$(curl -sL --max-time 20 https://charlietrenorden.com/chronoscape/                    | grep -oE 'v3\.[0-9]+' | head -1)
            echo "attempt $i: live=${LIVE:-unknown}"
            if [ "$LIVE" = "$BUILT" ]; then echo "live matches the build"; exit 0; fi
            sleep 15
          done
          echo "::error title=Not live::Built $BUILT but charlietrenorden.com/chronoscape           is still serving ${LIVE:-nothing readable} after three minutes."
          exit 1

      # The old subdomain must keep redirecting. If someone redeploys the site over the
      # redirect, this catches it rather than letting two canonical copies drift apart.
      - name: Confirm the old subdomain still redirects
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}'                  "https://chronoscape.charlietrenorden.com/taiwan/?cb=$RANDOM")
          LOC=$(curl -s -o /dev/null -w '%{redirect_url}'                  "https://chronoscape.charlietrenorden.com/taiwan/?cb=$RANDOM")
          echo "$CODE -> $LOC"
          case "$CODE:$LOC" in
            301:https://charlietrenorden.com/chronoscape/taiwan/*) echo "redirect intact" ;;
            *) echo "::warning title=Subdomain not redirecting::chronoscape.charlietrenorden.com                returned $CODE to ${LOC:-nothing}. It should 301 to the /chronoscape/ path.                If it is serving the site again, something redeployed over the _redirects                build - see the header of this file." ;;
          esac
